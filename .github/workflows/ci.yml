
name: ReleaseTrack CI

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-build:
    name: Backend Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x backend/mvnw

      - name: Build and test backend
        run: ./backend/mvnw -B -f backend/pom.xml clean verify

      - name: Upload backend JAR
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: backend/target/releasetrack-backend-1.0.0.jar
          if-no-files-found: error

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error

  release-artifact:
    name: Create Release Artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs:
      - backend-build
      - frontend-build

    # Create release packages only after code is pushed to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download backend JAR
        uses: actions/download-artifact@v7
        with:
          name: backend-jar
          path: release/

      - name: Download frontend build
        uses: actions/download-artifact@v7
        with:
          name: frontend-dist
          path: release/frontend/

      - name: Create release metadata
        run: |
          cat > release/release-metadata.json <<EOF
          {
            "application": "ReleaseTrack",
            "version": "1.0.0",
            "artifact": "releasetrack-1.0.0.zip",
            "source_commit": "${GITHUB_SHA}",
            "build_date_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Package release ZIP
        run: zip -r releasetrack-1.0.0.zip release/

      - name: Generate SHA-256 checksum
        run: sha256sum releasetrack-1.0.0.zip > releasetrack-1.0.0.zip.sha256

      - name: Upload final release package
        uses: actions/upload-artifact@v7
        with:
          name: releasetrack-release-1.0.0
          path: |
            releasetrack-1.0.0.zip
            releasetrack-1.0.0.zip.sha256
            releasetrack-backend-1.0.0.jar.sha256
            frontend-dist-1.0.0.zip
            frontend-dist-1.0.0.zip.sha256
          if-no-files-found: error
          retention-days: 
            
      - name: Debug GitHub OIDC claims
        shell: bash
        run: |
          TOKEN_RESPONSE=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$TOKEN_RESPONSE" | python3 -c \
            "import sys,json; print(json.load(sys.stdin)['value'])")

          export TOKEN
          python3 - <<'PY'
          import os, json, base64

          token = os.environ["TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          print("Issuer:", claims.get("iss"))
          print("Audience:", claims.get("aud"))
          print("Subject:", claims.get("sub"))
          PY

          unset TOKEN

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::021152723784:role/GitHubActions-ReleaseTrack-S3-Upload
          aws-region: ap-south-1

      - name: Upload release packages to S3
        run: |
          S3_PATH="s3://releasetrack-artifacts-2026-unique/releases/${GITHUB_SHA}"

          aws s3 cp release/releasetrack-backend-1.0.0.jar "$S3_PATH/backend/"
          aws s3 cp releasetrack-backend-1.0.0.jar.sha256 "$S3_PATH/backend/"

          aws s3 cp frontend-dist-1.0.0.zip "$S3_PATH/frontend/"
          aws s3 cp frontend-dist-1.0.0.zip.sha256 "$S3_PATH/frontend/"

          aws s3 cp releasetrack-1.0.0.zip "$S3_PATH/"
          aws s3 cp releasetrack-1.0.0.zip.sha256 "$S3_PATH/"

      - name: Package frontend for deployment
        run: |
          cd release
          zip -r ../frontend-dist-1.0.0.zip frontend/

      - name: Generate SHA-256 checksums
        run: |
          sha256sum release/releasetrack-backend-1.0.0.jar \
            > releasetrack-backend-1.0.0.jar.sha256

          sha256sum frontend-dist-1.0.0.zip \
            > frontend-dist-1.0.0.zip.sha256

          sha256sum releasetrack-1.0.0.zip \
            > releasetrack-1.0.0.zip.sha256