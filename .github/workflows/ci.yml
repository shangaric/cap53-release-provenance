
name: ReleaseTrack CI

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-build:
    name: Backend Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x backend/mvnw

      - name: Build and test backend
        run: ./backend/mvnw -B -f backend/pom.xml clean verify

      - name: Upload backend JAR
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: backend/target/releasetrack-backend-1.0.0.jar
          if-no-files-found: error

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error

  release-artifact:
    name: Create Release Artifact
    runs-on: ubuntu-latest
    needs:
      - backend-build
      - frontend-build

    # Create release packages only after code is pushed to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download backend JAR
        uses: actions/download-artifact@v7
        with:
          name: backend-jar
          path: release/

      - name: Download frontend build
        uses: actions/download-artifact@v7
        with:
          name: frontend-dist
          path: release/frontend/

      - name: Create release metadata
        run: |
          cat > release/release-metadata.json <<EOF
          {
            "application": "ReleaseTrack",
            "version": "1.0.0",
            "artifact": "releasetrack-1.0.0.zip",
            "source_commit": "${GITHUB_SHA}",
            "build_date_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Package release ZIP
        run: zip -r releasetrack-1.0.0.zip release/

      - name: Generate SHA-256 checksum
        run: sha256sum releasetrack-1.0.0.zip > releasetrack-1.0.0.zip.sha256

      - name: Upload final release package
        uses: actions/upload-artifact@v7
        with:
          name: releasetrack-release-1.0.0
          path: |
            releasetrack-1.0.0.zip
            releasetrack-1.0.0.zip.sha256
          if-no-files-found: error
          retention-days: 30
